name: CI

on:
  push:
    branches: [main, improvements]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hris_test
          MYSQL_USER: hris
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, mysql, sqlite, pdo, pdo_mysql, pdo_sqlite, gd, zip
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        run: php artisan key:generate

      - name: Execute code style (Pint)
        run: vendor/bin/pint --test

      - name: Execute syntax checks
        run: find app -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Execute tests (Unit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hris_test
          DB_USERNAME: hris
          DB_PASSWORD: secret
        run: php artisan test --testsuite=Unit

      - name: Execute tests (Feature)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: hris_test
          DB_USERNAME: hris
          DB_PASSWORD: secret
        run: php artisan test --testsuite=Feature
